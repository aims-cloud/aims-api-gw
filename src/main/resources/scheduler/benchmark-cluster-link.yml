# 배치 비교 — 링크 판. 주 결과판(benchmark-cluster-main.yml)의 노드 블록을 한 글자도 바꾸지 않고 재사용하고, links 절과 워크로드 데이터 MDC 순환 배정만 더했다.
# (벤치마크 하네스만 읽는다. 운영·시연 경로는 synthetic-cluster.yml 그대로.)
#
# 무엇을 재는가 — 링크 점수(NetworkModel.linkScore)를 총점에 섞는 엔진은 weighted 하나뿐이다(power 는 linkMatrix 를 보지 않고, 자원전용 두 변종은
# networkWeight 0, 대조군 6열은 네트워크 개념이 없다). 그래서 이 판에서 값이 달라지는 열은 weighted 계열뿐이고, 비교는 판 사이가 아니라
# 같은 판 안의 게이트 on/off 열 쌍(weighted · weighted-affinity)으로 한다 — netScore 경로가 실제로 작동하는지 보는 판이며 전력 판정과 무관하다.
# 판정·방향 판정 자격은 없다(폐쇄형 자격 문장 — BenchmarkRules.GAP_JUDGMENT_RULE).
#
# 링크 두 쌍과 미등록 한 쌍: a-b 는 등록 UP 8ms(양호), a-c 는 등록 DEGRADED 45ms·손실 1.5%(열화), b-c 는 미등록(설정값 unknownLinkScore, 기본 0.5).
# 대역폭은 a-b 10000Mbps(넉넉), a-c 1000Mbps(빠듯)로 둔다 — 요구 대역폭 배정과 맞물려 a-c 경로에서만 부족분이 생긴다.
# 워크로드 요구 대역폭은 [없음, 500, 2000] 을 표본 순서대로 순환 배정한다. 없음은 이 항이 켜지기 전과 같은 계산이고, 500 은 두 링크를 모두 충족하며,
# 2000 은 a-c(1000)에만 50% 모자라 그 경로를 깎는다 — 한 판 안에서 "항이 꺼진 워크로드·충족·부족" 세 갈래가 전부 실사용된다.
# 워크로드는 표본 순서대로 dataMdcId 를 [bm-mdc-a, bm-mdc-b, bm-mdc-c] 로 순환 배정한다 — 데이터 MDC 를 하나로 고정하면 질의 쌍이 a-a·a-b·a-c 뿐이라
# 미등록 경로를 한 번도 밟지 않고, 한 MDC 의 4노드로 계통 편향이 생긴다. 순환이면 같은 MDC(1.0)·등록 UP·등록 DEGRADED·미등록 네 경로가 전부 실사용된다.
# 배정은 전략 실행 전에 결정론적으로 끝나 전 열이 같은 워크로드 목록을 본다. DOWN 링크는 두지 않는다 — 제약 C5 가 후보를 제거해 노드 구성이 같다는 전제가 깨진다.
#
# 링크는 이 판 파일이 원장 노릇을 한다 — DB 의 MDC 링크 원장(0건)과 무관하다. 워크로드 분포 파일은 건드리지 않아 그 다이제스트는 불변이다.
