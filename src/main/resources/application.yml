spring:
  application:
    name: aims-cloud-backend
  # 프로파일을 지정하지 않고 IDE 에서 그냥 실행하면 local 로 뜬다.
  profiles:
    default: local

  # ── 데이터소스 ──────────────────────────────────────────────
  datasource:
    url: ${AIMS_DB_URL}
    username: ${AIMS_DB_USER}
    password: ${AIMS_DB_PASSWORD}
    driver-class-name: ${AIMS_DB_DRIVER:org.postgresql.Driver}

  # ── 알람 Email 발송 (docs/09 A.5.4) ─────────────────────────
  # host 는 환경 변수(SPRING_MAIL_HOST)로만 넣는다. host 가 없으면 JavaMailSender 빈이 만들어지지 않고 Email 전송은 "미구성" FAILED.
  mail:
    properties:
      mail.smtp.auth: ${AIMS_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${AIMS_MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

server:
  port: ${AIMS_SERVER_PORT:8080}
  # SIGTERM 을 받으면 진행 중인 요청을 마무리한 뒤 종료한다.
  # systemd restart 시 요청이 끊기지 않게 해주는 설정.
  shutdown: graceful

management:
  health:
    mail:
      # 메일 서버 연결 검사를 백엔드 헬스에서 뺀다 — SMTP 가 죽어도 포털 API 는 정상이고, 전송 실패는 알람 전송 원장(FAILED 사유)에 남는다
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.innogrid.aims: INFO

# ── Cloud-Barista 연동 설정 ─────────────────────────────────
cloud-barista:
  spider:
    base-url: ${CB_SPIDER_URL}
  tumblebug:
    base-url: ${CB_TUMBLEBUG_URL}
    username: ${CB_TUMBLEBUG_USER}
    password: ${CB_TUMBLEBUG_PASS}

# ── OpenStack 연동 설정 ─────────────────────────────────────
# 최종 연동 대상은 1세부 OpenStack. 구축 전까지 자체 구축 OpenStack 사용.
# 환경변수만 바꾸면 전환되도록 코드에 기본값을 두지 않는다.
openstack:
  zone-name: ${OPENSTACK_ZONE_NAME:openstack-default}
  auth-url: ${OPENSTACK_AUTH_URL:}
  network-url: ${OPENSTACK_NETWORK_URL:}
  compute-url: ${OPENSTACK_COMPUTE_URL:}
  image-url: ${OPENSTACK_IMAGE_URL:}
  username: ${OPENSTACK_USERNAME:}
  password: ${OPENSTACK_PASSWORD:}
  project-name: ${OPENSTACK_PROJECT:}
  domain-name: ${OPENSTACK_DOMAIN:Default}
  # 사설 인증서 HTTPS 환경(자체 구축 OpenStack)에서는 false
  verify-tls: ${OPENSTACK_VERIFY_TLS:true}

# ── 메트릭 조회 설정 (Thanos Query — PromQL 호환) ──────────
victoria-metrics:
  base-url: ${METRICS_QUERY_URL}

# ── 로그 조회 설정 (Loki — LogQL) ──────────────────────────
loki:
  base-url: ${LOKI_URL:http://localhost:3100}

# ── 초기 관리자 계정 ───────────────────────────────────────
aims:
  admin:
    email: ${AIMS_ADMIN_EMAIL}
    password: ${AIMS_ADMIN_PASSWORD}
    name: ${AIMS_ADMIN_NAME:관리자}
  scheduler:
    # 모의 메트릭 모드(단계 19) — 1세부 데이터가 없는 동안 가상 클러스터로 시연·검증. 배포는 항상 false.
    mock-enabled: ${AIMS_SCHEDULER_MOCK_ENABLED:false}
  gpu-dashboard:
    # TODO:: 실제 Thanos 연동이 완료되면 Mock 설정 제거
    mock-enabled: ${AIMS_GPU_DASHBOARD_MOCK_ENABLED:false}
  alarm:
    evaluation:
      # 정책 평가 주기(초) — 메트릭당 Thanos 즉시 쿼리 1회. 기동 시 고정되어 변경은 재기동 후 반영 (docs/09 A.6 #6)
      interval-seconds: ${AIMS_ALARM_EVAL_INTERVAL_SECONDS:60}
      # rate() 창 — 스크레이프 간격의 4배 이상, 자원 탐색기 패널 rate 창 하한(5m)과 같게 유지
      rate-window: ${AIMS_ALARM_EVAL_RATE_WINDOW:5m}
    notification:
      # 알람 전송 (docs/09 A.5.4) — 발생 알람을 정책 수신자에게 Email 로 보낸다. 메일 서버는 SPRING_MAIL_HOST 등 환경 변수로.
      # 서버가 없으면 전송 원장에 "메일 서버 미구성" FAILED 로만 남고 평가·이력은 그대로 동작한다.
      enabled: ${AIMS_ALARM_NOTIFICATION_ENABLED:true}
      from: ${AIMS_ALARM_MAIL_FROM:}
      subject-prefix: "[AIMS]"
      max-attempts: 3
      retry-backoff: 2s
      threads: 2
  portal-log:
    retention:
      # 포털 로그 보존 배치 (docs/08 §9) — 매일 03:30, 일반 1년 / SYSTEM 90일. 배치 단위로 별도 트랜잭션, 한 실행 최대 200배치
      enabled: ${AIMS_PORTAL_LOG_RETENTION_ENABLED:true}
      cron: ${AIMS_PORTAL_LOG_RETENTION_CRON:0 30 3 * * *}
      default-days: ${AIMS_PORTAL_LOG_RETENTION_DEFAULT_DAYS:365}
      system-days: ${AIMS_PORTAL_LOG_RETENTION_SYSTEM_DAYS:90}
      batch-size: 5000
      max-batches-per-run: 200

# ── JWT 설정 ───────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: 1800000
  refresh-expiration-ms: 604800000

springdoc:
  swagger-ui:
    tags-sorter: alpha        # 태그 가나다순 정렬
    operations-sorter: alpha  # (선택) 태그 안의 엔드포인트도 정렬