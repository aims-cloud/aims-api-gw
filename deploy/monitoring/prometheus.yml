global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Thanos Receive로 데이터 전송
# Docker 환경: http://thanos-receive:19291/api/v1/receive
# 호스트 직접 실행: http://localhost:19291/api/v1/receive
remote_write:
  - url: "http://localhost:19291/api/v1/receive"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # MDC 노드 메트릭 (node_exporter)
  # 실제 환경에서는 MDC 노드 IP로 변경
  - job_name: "mdc-nodes"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "localhost:9100"
        labels:
          mdc_id: "mdc-01"
          mdc_name: "MDC-01"

