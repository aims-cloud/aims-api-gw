# AIMS 노드 로그 수집 에이전트(Grafana Alloy) — 세부1 물리 노드 전달용.
# 노드마다 다른 값은 같은 디렉터리의 alloy.env 에 둔다(alloy.env.example 참고). 이 파일과 config.alloy 는 전 노드 공통이다.
# 설치·확인 절차는 README.md.
services:
  alloy:
    image: grafana/alloy:v1.20.0
    container_name: aims-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    env_file:
      - alloy.env
    ports:
      # Alloy UI·상태 확인. 인증이 없으므로 이 노드 안(127.0.0.1)에서만 연다. 밖에서 보려면 ssh 포트 포워딩을 쓴다.
      - "127.0.0.1:12345:12345"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      # 읽기 위치(positions) 보존. 컨테이너를 다시 만들어도 같은 줄을 두 번 보내지 않는다.
      - alloy-data:/var/lib/alloy/data
      - /var/log:/var/log:ro
      # 포털에서 등록한 파일이 어느 경로에 있든 읽을 수 있게 호스트 루트를 읽기 전용으로 마운트한다. config.alloy 가 /host 를 붙였다 뗀다.
      - /:/host:ro,rslave
    restart: unless-stopped

volumes:
  alloy-data:
