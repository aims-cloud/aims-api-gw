# 스케줄러 가상 클러스터 — 1세부 데이터가 없는 동안 시연·검증에 쓰는 노드 정의 (aims.scheduler.mock-enabled=true 일 때만 읽음)
#
# 값은 시각의 함수다: 기준 사용률 ± swing(%p) 사인 곡선(주기 periodMinutes), 노드별 위상은 nodeId 해시 + seed 로 고정.
# 전력 = idleWatts + (capacityWatts - idleWatts) × CPU 사용률 · 온도 = baseTemperature + 0.3 × CPU 사용률.
# ipmi: false 인 노드는 전력·온도 메트릭이 없다(실환경의 미계측 노드). gpus 가 0 이면 DCGM 시리즈가 없다.
# capacityWatts 는 예약 필드 — 배치 엔진의 정격은 아직 설정 capacityByNode 에서 온다(로드맵 #6).
#
# 담긴 상황: IPMI 있음 5 / 없음 3, GPU 노드 2, 뜨거운 노드 1(seoul-03), 전력 비효율 노드 1(busan-02: 유휴인데 고전력),
#           디스크 부족 노드 1(daejeon-02), MDC 3곳.
name: demo-3mdc-8nodes
job: mdc-nodes
periodMinutes: 60
swing: 15
seed: 7
nodes:
  - { mdcId: mdc-seoul,   nodeId: "seoul-01:9100",   cores: 32, memoryMb: 131072, gpus: 0, cpuUsage: 35, memoryUsage: 45, diskTotalGb: 1000, diskUsage: 40, ipmi: true,  idleWatts: 160, capacityWatts: 600, baseTemperature: 38, trait: "일반" }
  - { mdcId: mdc-seoul,   nodeId: "seoul-02:9100",   cores: 32, memoryMb: 131072, gpus: 4, cpuUsage: 55, memoryUsage: 60, diskTotalGb: 2000, diskUsage: 50, ipmi: true,  idleWatts: 220, capacityWatts: 900, baseTemperature: 42, trait: "GPU" }
  - { mdcId: mdc-seoul,   nodeId: "seoul-03:9100",   cores: 16, memoryMb: 65536,  gpus: 0, cpuUsage: 70, memoryUsage: 55, diskTotalGb: 500,  diskUsage: 35, ipmi: true,  idleWatts: 150, capacityWatts: 500, baseTemperature: 62, trait: "뜨거움 — 온도 임계 근접" }
  - { mdcId: mdc-busan,   nodeId: "busan-01:9100",   cores: 24, memoryMb: 98304,  gpus: 0, cpuUsage: 15, memoryUsage: 30, diskTotalGb: 1000, diskUsage: 20, ipmi: true,  idleWatts: 140, capacityWatts: 500, baseTemperature: 36, trait: "여유" }
  - { mdcId: mdc-busan,   nodeId: "busan-02:9100",   cores: 24, memoryMb: 98304,  gpus: 0, cpuUsage: 5,  memoryUsage: 20, diskTotalGb: 1000, diskUsage: 15, ipmi: true,  idleWatts: 380, capacityWatts: 500, baseTemperature: 40, trait: "전력 비효율 — 유휴인데 고전력" }
  - { mdcId: mdc-busan,   nodeId: "busan-03:9100",   cores: 16, memoryMb: 65536,  gpus: 2, cpuUsage: 40, memoryUsage: 50, diskTotalGb: 1000, diskUsage: 45, ipmi: false, idleWatts: 150, capacityWatts: 500, baseTemperature: 40, trait: "GPU, IPMI 없음(미계측)" }
  - { mdcId: mdc-daejeon, nodeId: "daejeon-01:9100", cores: 8,  memoryMb: 32768,  gpus: 0, cpuUsage: 25, memoryUsage: 35, diskTotalGb: 500,  diskUsage: 30, ipmi: false, idleWatts: 120, capacityWatts: 400, baseTemperature: 39, trait: "소형, IPMI 없음" }
  - { mdcId: mdc-daejeon, nodeId: "daejeon-02:9100", cores: 8,  memoryMb: 32768,  gpus: 0, cpuUsage: 30, memoryUsage: 40, diskTotalGb: 200,  diskUsage: 96, ipmi: false, idleWatts: 120, capacityWatts: 400, baseTemperature: 39, trait: "디스크 부족, IPMI 없음" }
