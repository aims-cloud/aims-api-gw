# 배치 비교 — 볼록 생성식 · 정격 어긋남 복합 판(판정판). 두 요인이 함께 걸린 이 판의 부하율 60% · 전원 제어 있음 셀이 사전 등록된 판정 셀이다.
# 결과 순위(전략 순위)는 여전히 주 결과판에서 보고한다 — 이 판은 다음 엔진 변경의 효과를 판정할 자리이지 순위를 뜨는 자리가 아니다.
# (벤치마크 하네스만 읽는다. 운영·시연 경로는 synthetic-cluster.yml 그대로.)
#
# 생성식: 전력(W) = idleWatts + (capacityWatts - idleWatts) × (CPU 사용률/100)^β, β = powerExponent = 1.6 · 온도(℃) = baseTemperature + 0.3 × CPU 사용률.
# β 를 1 보다 크게 둔 것은 실서버 곡선의 근사가 아니라 엔진의 선형 가정이 틀린 방향으로 세계를 기울인 응력 시험이다 —
# 문헌에는 반대 방향(오목)의 보고도 있고 값 자체에 물리적 근거는 없다. 1.4 는 문헌 계수와 같은 수라 '문헌 근거' 로 오독되어 피했고,
# 1.8 은 엔진 시험의 곡률 계수와 같은 수라 피했다. 값은 상수 한 곳(BenchmarkRules.CONVEX_POWER_EXPONENT)에도 사전 등록되어 있고, 바뀌면 이 판으로 뜬 기준선은 무효다.
#
# 두 정격의 뜻: capacityWatts 는 생성식이 쓰는 정격이고 이 판에서도 주 결과판 그대로다. believedCapacityWatts 는 판이 엔진에게 알려 주는 정격이며,
# 노드마다 정확히 ±10% 어긋나 있다 — 과대 믿음은 capacityWatts × 1.1, 과소 믿음은 × 0.9 다(비율은 BenchmarkRules.CAPACITY_MISMATCH_RATIO 에 사전 등록되어 있다).
#
# 부호 규칙(손으로 고르지 않는다 — 계약 시험이 이 파일만 보고 재계산한다): 노드를 두 층으로 나눈다.
#  · 유휴 층 = 시각 12지점 전부 통전 문턱(5%) 아래에 머무는 계측 노드로, 깨우기 벌점이 붙는 유일한 층이다(bm-10~bm-14).
#  · 가동 층 = 나머지(bm-01~bm-09).
# 층마다 노드를 절반(홀수면 한쪽이 하나 많다)으로 갈라 한쪽은 과대, 다른 쪽은 과소로 둔다. 어느 절반인지는 층마다 한 가지 양을 최소로 하는 분할이 정한다 —
# 유휴 층은 엔진에 실제로 들어가는 양인 깨우기 벌점 평균의 편향 |Σ r/(1+δ) − Σ r| / Σ r (r = 선언 유휴/정격), 가동 층은 정격 합의 편중 |Σ₊cap − Σ₋cap| / Σcap.
# 동률이면 과대 믿음 집합의 nodeId 열을 사전순으로 비교해 앞선 것을 쓴다.
#
# 그 규칙을 이 판의 값에 적용한 결과:
#  · 유휴 층 과대 = bm-10 · bm-12 · bm-13, 과소 = bm-11 · bm-14 → 깨우기 벌점 편향 0.037%(수용 기준 1% 이하). 같은 층의 정격 합 편중은 25.8% 이고 보고만 한다 —
#    한 층에서 두 양을 동시에 맞출 수 없어(정격 합을 맞추면 벌점 편향이 2.6~4.6% 가 된다) 층마다 하나만 최소로 한다.
#  · 가동 층 과대 = bm-01 · bm-02 · bm-04 · bm-06, 과소 = bm-03 · bm-05 · bm-07 · bm-08 · bm-09 → 정격 합 편중 0.85%(수용 기준 5% 이하).
#    이 층의 어긋남은 전력 제약의 여유와 전력 인지 대조군의 선택에만 닿는다.
#
# 읽을 때 주의(둘): 첫째, 두 오차항은 노드에 따라 서로 상쇄한다 — 과소 믿음 노드에서는 볼록성의 적자와 정격 오차가 반대 부호라 유휴 역산이 선언값에 가까워질 수 있다.
# 그런 행을 '항등이 살아남았다' 로 읽으면 안 된다. 두 항이 각각 얼마인지는 응답의 boards[].wakeupReconstructionCheck 에 있다.
# 둘째, 판정 셀(부하율 60% · 전원 제어 있음)은 현 시스템에 없는 전원 제어를 가정한 값이라 배포 환경에서 재현되지 않는다.
# 전원 제어가 없는 같은 부하율의 셀은 보고만 하는 2차 셀이다.
#
# 그 밖의 값은 주 결과판(benchmark-cluster-main.yml)과 한 글자도 다르지 않다 — 노드 구성·사용률·온도·seed·주기가 모두 같다.
# 이 판이 주 결과판과 다른 것은 이름과 powerExponent 한 줄, 그리고 노드마다 붙인 believedCapacityWatts 한 칸뿐이다.
name: benchmark-convex-misrated-14nodes
