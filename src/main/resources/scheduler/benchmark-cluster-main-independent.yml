# 배치 비교 — 주 결과판의 위상 독립 짝. 노드 블록은 benchmark-cluster-main.yml 과 한 글자도 다르지 않고, phaseMode·seeds 두 줄만 더했다.
# 위상 독립: legacy 위상은 (seed·31^L + hash(nodeId)) mod 1000 이라 nodeId 길이가 전부 같은 이 판에서 seed 는 전 노드 위상에 같은 상수(seed·801)만 더한다 —
# seed 를 늘려도 12지점은 여전히 한 궤적의 12점이라 표본이 늘지 않는다. phaseMode: independent 는 노드별 위상을 seed 와 nodeId 해시의 SplitMix64 혼합으로
# 다시 뽑아 seed 마다 다른 위상 구성을 만든다(상수는 BenchmarkRules.PHASE_MIX_*). seeds 마다 Board 하나씩(boards[].phaseSeed) — 서로 독립 복제이고,
# 판정 규칙의 지점 지수 i 는 한 Board 안에서만 정의된다. Board 사이의 결합은 중앙값 수준에서만, 보고는 중앙값 3값과 최소~최대 범위(기술통계)로 한정한다.
# (벤치마크 하네스만 읽는다. 운영·시연 경로는 synthetic-cluster.yml 그대로.)
# 방향판(main)의 짝이다 — 방향 판정 자격은 여전히 main 에만 있고 이 판은 위상 구성 3벌에서 그 방향이 흔들리는지를 보는 자리다.
name: benchmark-main-independent-14nodes
job: mdc-nodes
periodMinutes: 60
swing: 15
phaseMode: independent
seeds: [7, 11, 13]
