spring:
  application:
    name: aims-cloud-backend
  datasource:
    url: jdbc:h2:mem:aims-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # create-drop 이면 컨텍스트가 닫히거나 기동에 실패할 때 스키마를 지운다. 테스트 컨텍스트 여러 개가 같은 H2(aims-test)를
      # 함께 쓰므로, 하나가 닫히면 살아 있는 다른 컨텍스트가 "Table … not found" 로 깨진다. create 는 기동 때만 새로 만든다
      ddl-auto: create
    database-platform: org.hibernate.dialect.H2Dialect

cloud-barista:
  spider:
    base-url: http://localhost:1024/spider
  tumblebug:
    base-url: http://localhost:1323/tumblebug
    username: default
    password: default

victoria-metrics:
  base-url: http://localhost:19192

aims:
  admin:
    email: test@test.local
    password: testpassword123!
  gpu-dashboard:
    # TODO:: 실제 Thanos 연동이 완료되어 테스트가 Thanos 대역을 사용하면 Mock 설정 제거
    mock-enabled: true
  scheduler:
    # 스케줄 러너의 폴링이 테스트 도중 실제로 돌지 않게 최초 지연을 크게 둔다.
    # 기본값은 30초인데 전체 스위트가 그보다 오래 걸려, 테스트가 심어 둔 "예정 시각이 지난" 스케줄을
    # 폴러가 진짜로 집어가 무작위 실패를 만든다. 러너 자체의 동작은 ScheduleRunnerTest 가 따로 본다.
    initial-delay-seconds: 86400
  alarm:
    notification:
      # 발송 재시도 대기를 거의 없애 테스트를 빠르게
      retry-backoff: 10ms

jwt:
  secret: test-secret-key-for-unit-tests-must-be-32bytes!!
