# 배치 비교 — 오목 생성식 판(부록). 주 결과판에 생성식 지수 하나만 얹어, 엔진의 선형 가정이 볼록 판과 정확히 반대쪽으로 어긋났을 때를 본다.
# 결과 순위를 이 판에서 보고하지 않는다(벤치마크 하네스만 읽는다. 운영·시연 경로는 synthetic-cluster.yml 그대로).
#
# 생성식: 전력(W) = idleWatts + (capacityWatts - idleWatts) × (CPU 사용률/100)^β, β = powerExponent = 0.625 = 1/1.6 · 온도(℃) = baseTemperature + 0.3 × CPU 사용률.
# β 는 볼록 판 지수(1.6)의 역수다 — 볼록 판이 엔진 가정을 한쪽으로 기울였으면 이 판은 정확히 반대쪽으로 기울인다는 대칭이 근거의 전부이고,
# 값 자체에 물리적 근거는 없다(상수 BenchmarkRules.CONCAVE_POWER_EXPONENT 에 사전 등록). u^0.625 > u 라 저부하에서 전력이 선형보다 높다.
#
# 판정·방향 판정 자격 없음(폐쇄형 자격 문장). 이 판은 생성 전력·역산 유휴·오라클 세 경로가 함께 바뀌므로 원인을 지목하지 않는다 —
# 결론은 BenchmarkRules.CONCAVE_CONCLUSION_TEMPLATE 의 형식으로만 적고, power-idle-fixed 열이 역산 경로의 기여를 분리한다.
# seed 는 하나(legacy 위상)다 — β 와 위상 두 축을 한 판에 걸면 요인이 교락한다.
#
# 이 판이 늘리는 실질 한계 전력 최댓값은 판 데이터의 사실이라 MAX_REAL_MARGINAL_WATTS(시험 전용)만 갱신하고, 판정 전제가 걸린 고정값
# MAX_REAL_MARGINAL_WATTS_AT_JUDGMENT(316) 는 바뀌지 않는다. 실측이 기본 눈금 500W 를 넘으면 이 판은 도입하지 않는다.
#
# 그 밖의 값은 주 결과판(benchmark-cluster-main.yml)과 한 글자도 다르지 않다 — 이 판이 주 결과판과 다른 것은 이름과 powerExponent 한 줄뿐이다.
name: benchmark-concave-14nodes
job: mdc-nodes
periodMinutes: 60
swing: 15
seed: 7
powerExponent: 0.625
nodes:
