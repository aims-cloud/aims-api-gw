# 배치 비교 — 주 결과판. 전략 순위를 이 판에서 보고한다(벤치마크 하네스만 읽는다. 운영·시연 경로는 synthetic-cluster.yml 그대로).
#
# 값은 시각의 함수다: 기준 사용률 ± swing(%p) 사인 곡선(주기 periodMinutes), 노드별 위상은 nodeId 해시 + seed 로 고정.
# 전력 = idleWatts + (capacityWatts - idleWatts) × CPU 사용률 · 온도 = baseTemperature + 0.3 × CPU 사용률.
#
# 왜 이 값인가 — 이 판은 결과를 인용할 판이므로, 우리 엔진에 유리하게 작용할 우연을 하나씩 제거한 자리에 두었다.
#  · 전 노드 ipmi: true — 미계측 노드가 하나라도 있으면 "온도·전력을 모르니 중립 0.5" 라는 배출구가 순위에 섞인다.
#    주 결과에서는 그 구멍을 막고, 센서 공백이 결과를 얼마나 바꾸는지는 benchmark-cluster-sparse.yml 과의 차이로 따로 잰다.
#  · idleWatts/capacityWatts 를 0.20~0.45 로 흩뿌렸다 — 전부 0.30 으로 두면 엔진 설정 power.idle-ratio=0.3 과 같아져
#    "유휴 전력은 정격의 30%" 라는 우리 가정이 공짜로 맞는다. 그러면 대조군이 아니라 자기 가정의 확인이 된다(실측 0.20~0.45).
#  · 정격 400~900W 와 코어당 지상진실 전력((정격−유휴)/코어)의 상관을 양방향으로 두었다 — 큰 노드가 효율적인 경우(bm-05: 8.4W/코어)와
#    비효율적인 경우(bm-02: 34.5W/코어)를 함께 넣어, "큰 노드는 비효율" 이라는 심을 수 있는 편향을 지웠다(실측 상관 −0.21).
#  · memoryMb 는 정확히 코어 × 4096MB — 대상 워크로드 생성(benchmark-workloads-*.yml 의 memoryPerCore)이 이 비율을 쓴다.
#    노드마다 비율이 다르면 부하율의 분모(정책 상한까지의 여유)가 노드 구성에 따라 흔들려 부하율 자체가 판마다 다른 뜻이 된다.
#  · diskTotalGb 를 넉넉히, diskUsage 를 38% 이하로 — 디스크가 먼저 막히면 비교하려던 전력·열 판단이 그 뒤에 가려진다.
#
# 담긴 상황: 노드 14대 전수 계측 / 유휴 5대(bm-10~bm-14: cpuUsage+swing ≤ 3 이라 가동 판정 5%(power.active-cpu-percent) 아래에
#           확실히 머문다) · 가동 9대(기준 20~70%) / 경고 구간(기본 경고 65℃ 이상, 임계 75℃ 미만) 2대 — bm-02 최고 73.0℃,
#           bm-05 최고 72.0℃ / GPU 8장을 3대에 분산(bm-05 4 · bm-01 2 · bm-12 2) / MDC 3곳.
#
# 노드마다 swing 을 적어 둔 까닭: 계약 테스트가 파일만 보고 사용률 상한(cpuUsage+swing)과 최고 온도를 계산할 수 있어야 한다.
# 유휴 5대는 swing: 1 이라 최고 사용률이 3% 이고, 가동 9대는 클러스터 공통과 같은 15 를 그대로 적었다.
name: benchmark-main-14nodes
job: mdc-nodes
periodMinutes: 60
swing: 15
seed: 7
