# 배치 비교 — 볼록 생성식 판(부록). 주 결과판에 생성식 지수 하나만 얹어, 엔진이 믿는 선형 관계가 세계와 어긋났을 때 무엇이 달라지는지를 귀속시키는 자리다.
# 결과 순위를 이 판에서 보고하지 않는다(벤치마크 하네스만 읽는다. 운영·시연 경로는 synthetic-cluster.yml 그대로).
#
# 생성식: 전력(W) = idleWatts + (capacityWatts - idleWatts) × (CPU 사용률/100)^β, β = powerExponent = 1.6 · 온도(℃) = baseTemperature + 0.3 × CPU 사용률.
# β 를 1 보다 크게 둔 것은 실서버 곡선의 근사가 아니라 엔진의 선형 가정이 틀린 방향으로 세계를 기울인 응력 시험이다 —
# 문헌에는 반대 방향(오목)의 보고도 있고 값 자체에 물리적 근거는 없다. 1.4 는 문헌 계수와 같은 수라 '문헌 근거' 로 오독되어 피했고,
# 1.8 은 엔진 시험의 곡률 계수와 같은 수라 피했다. 값은 상수 한 곳(BenchmarkRules.CONVEX_POWER_EXPONENT)에도 사전 등록되어 있고, 바뀌면 이 판으로 뜬 기준선은 무효다.
#
# 두 정격의 뜻: capacityWatts 는 생성식이 쓰는 정격이고, believedCapacityWatts 는 판이 엔진에게 알려 주는 정격이다.
# 이 판은 둘을 어긋나게 두지 않는다 — believedCapacityWatts 를 적지 않아 생성식 정격과 같다. 어긋남은 benchmark-cluster-misrated.yml 이 맡는다.
#
# 읽을 때 주의: 엔진의 깨우기 비용 역산은 선형식을 풀어 얻은 것이라 이 판에서는 선언된 유휴 전력을 복원하지 못하고 낮게 본다.
# 노드별 그 차이는 응답의 boards[].wakeupReconstructionCheck 에 있다. 여기서 벌어지는 격차는 볼록한 세계에서의 값이지 실측 서버의 값이 아니다.
#
# 그 밖의 값은 주 결과판(benchmark-cluster-main.yml)과 한 글자도 다르지 않다 — 노드 구성·사용률·온도·seed·주기가 모두 같다.
# 이 판이 주 결과판과 다른 것은 이름과 powerExponent 한 줄뿐이라, 두 판의 차이는 '생성식이 볼록한가' 하나로만 설명된다.
name: benchmark-convex-14nodes
job: mdc-nodes
periodMinutes: 60
swing: 15
seed: 7
powerExponent: 1.6
